<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>The Living Red List Globe - 살아있는 멸종위기 지도</title>
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Mobile Menu Toggle -->
        <button class="menu-toggle" id="menu-toggle" aria-label="메뉴 열기">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Header -->
        <header class="header">
            <h1>🌍 The Living Red List Globe</h1>
            <p class="subtitle">살아있는 멸종위기 지도</p>
            <span class="version-badge">v1.1.0</span>
            <button class="language-toggle" id="language-toggle" aria-label="언어 전환">
                <span class="lang-option active" data-lang="ko">한국어</span>
                <span class="lang-divider">/</span>
                <span class="lang-option" data-lang="en">English</span>
            </button>
        </header>

        <!-- Main Canvas -->
        <div id="globe-container"></div>

        <!-- Info Panel -->
        <div id="info-panel" class="info-panel hidden">
            <div class="panel-handle"></div>
            <button class="close-btn" id="close-panel" aria-label="닫기">&times;</button>
            <div class="info-content">
                <div id="species-image" class="species-image"></div>
                <h2 id="species-name">동물 이름</h2>
                <p class="scientific-name" id="scientific-name">학명</p>
                <div class="status-badge" id="status-badge">상태</div>

                <div class="info-section">
                    <h3>🚨 왜 위기인가요?</h3>
                    <p id="threats">위협 요인 정보</p>
                </div>

                <div class="info-section">
                    <h3>📍 어디에 사나요?</h3>
                    <p id="habitat">서식지 정보</p>
                </div>

                <div class="info-section">
                    <h3>📊 남은 개체 수</h3>
                    <p id="population">개체 수 정보</p>
                </div>

                <div class="info-section info-links">
                    <h3>🔗 더 알아보기</h3>
                    <div class="link-buttons">
                        <a id="link-wikipedia" href="#" target="_blank" rel="noopener noreferrer" class="link-button">
                            <span class="link-icon">📖</span>
                            <span>위키피디아</span>
                        </a>
                        <a id="link-news" href="#" target="_blank" rel="noopener noreferrer" class="link-button">
                            <span class="link-icon">📰</span>
                            <span>뉴스 검색</span>
                        </a>
                        <a id="link-iucn" href="#" target="_blank" rel="noopener noreferrer" class="link-button">
                            <span class="link-icon">🌐</span>
                            <span>IUCN 정보</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Legend (Collapsible) -->
        <div class="legend" id="legend">
            <button class="legend-toggle" id="legend-toggle" aria-label="범례 접기/펼치기">
                <div class="legend-title-group">
                    <span class="legend-title-main">멸종 등급</span>
                    <span class="legend-title-sub" id="legend-description">IUCN 멸종위기등급</span>
                </div>
                <span class="toggle-icon">▼</span>
            </button>
            <div class="legend-content">
                <div class="legend-item">
                    <div class="legend-item-left">
                        <span class="legend-color" style="background: #000000;"></span>
                        <span class="legend-code">EX</span>
                    </div>
                    <span class="legend-desc" data-status="EX">이미 멸종</span>
                </div>
                <div class="legend-item">
                    <div class="legend-item-left">
                        <span class="legend-color" style="background: #4A4A4A;"></span>
                        <span class="legend-code">EW</span>
                    </div>
                    <span class="legend-desc" data-status="EW">야생에서 멸종</span>
                </div>
                <div class="legend-item">
                    <div class="legend-item-left">
                        <span class="legend-color" style="background: #D32F2F;"></span>
                        <span class="legend-code">CR</span>
                    </div>
                    <span class="legend-desc" data-status="CR">심각한 위험</span>
                </div>
                <div class="legend-item">
                    <div class="legend-item-left">
                        <span class="legend-color" style="background: #FF6F00;"></span>
                        <span class="legend-code">EN</span>
                    </div>
                    <span class="legend-desc" data-status="EN">멸종 위기</span>
                </div>
                <div class="legend-item">
                    <div class="legend-item-left">
                        <span class="legend-color" style="background: #FBC02D;"></span>
                        <span class="legend-code">VU</span>
                    </div>
                    <span class="legend-desc" data-status="VU">취약</span>
                </div>
            </div>
        </div>

        <!-- Timeline Controls (Simplified for mobile) -->
        <div class="timeline-controls">
            <div class="timeline-header">
                <span class="timeline-label">시간대</span>
                <span class="year-display" id="current-year">2024</span>
            </div>
            <input type="range" id="year-slider" min="1900" max="2024" value="2024" step="1">
            <div class="timeline-info">
                <span id="species-count">0</span> 종
            </div>
        </div>

        <!-- Filter Panel (Collapsible) -->
        <div class="filter-panel" id="filter-panel">
            <div class="filter-header">
                <h3>필터</h3>
                <button class="filter-close" id="filter-close" aria-label="필터 닫기">&times;</button>
            </div>

            <div class="filter-group">
                <label>등급</label>
                <div class="filter-options filter-chips">
                    <label class="chip"><input type="checkbox" value="EX" checked><span>EX</span></label>
                    <label class="chip"><input type="checkbox" value="EW" checked><span>EW</span></label>
                    <label class="chip"><input type="checkbox" value="CR" checked><span>CR</span></label>
                    <label class="chip"><input type="checkbox" value="EN" checked><span>EN</span></label>
                    <label class="chip"><input type="checkbox" value="VU" checked><span>VU</span></label>
                </div>
            </div>

            <div class="filter-group">
                <label id="continent-filter-label">대륙</label>
                <select id="continent-filter">
                    <option value="ALL">전체</option>
                    <option value="AFRICA">아프리카</option>
                    <option value="ASIA">아시아</option>
                    <option value="EUROPE">유럽</option>
                    <option value="NORTH AMERICA">북아메리카</option>
                    <option value="SOUTH AMERICA">남아메리카</option>
                    <option value="AUSTRALIA">오세아니아</option>
                    <option value="ANTARCTICA">남극</option>
                </select>
            </div>

            <div class="filter-group">
                <label>검색</label>
                <input type="text" id="species-search" placeholder="동물 이름...">
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>데이터를 불러오는 중...</p>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
